function formatCHF(n) { return "CHF " + n.toLocaleString("fr-CH"); }
function daysUntil(dateStr) { const d = new Date(dateStr + "T00:00:00"); return Math.round((d - TODAY) / 86400000); }
function formatDate(dateStr) { const d = new Date(dateStr + "T00:00:00"); return d.toLocaleDateString("fr-CH", { day: "2-digit", month: "2-digit", year: "numeric" }); }
function nextQuarterly(dateStr) {
  let d = new Date(dateStr + "T00:00:00");
  while (d < TODAY) {
    d = new Date(d.getFullYear(), d.getMonth() + 3, d.getDate());
  }
  return d;
}
function daysUntilDate(d) { return Math.round((d - TODAY) / 86400000); }

function computeCommission(client, rates) {
  if (client.pillar === "2e pilier") return null; // handled at fund level, not per client
  switch (client.productType) {
    case "Bancaire":
      return { type: "Bancaire", amount: 0, note: "Compte d'épargne — aucune commission." };
    case "Assurance":
      return {
        type: "Assurance",
        amount: Math.round(client.capital * (rates.assurance / 100)),
        note: "Commission unique à la souscription, estimée sur le capital du dossier.",
      };
    case "Fonds de placement":
      return {
        type: "Fonds de placement",
        amount: Math.round(client.capital * (rates.fonds / 100)),
        note: "Commission de gestion annuelle (TER), estimée sur le capital du dossier.",
      };
    default:
      return null;
  }
}

function CRMPrototype() {
  const [view, setView] = useState("dashboard");
  const [search, setSearch] = useState("");
  const [pillarFilter, setPillarFilter] = useState("Tous");
  const [statusFilter, setStatusFilter] = useState("Tous");
  const [advisorFilter, setAdvisorFilter] = useState("Tous");
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState("asc");
  const [selected, setSelected] = useState(null);
  const [deals, setDeals] = useState(INITIAL_DEALS);
  const [toast, setToast] = useState("");
  const [people, setPeople] = useState(INITIAL_PEOPLE);
  const [dossiers, setDossiers] = useState(INITIAL_DOSSIERS);
  const [rates, setRates] = useState({ pilier2: 0.65, pilier2Signature: 3, assurance: 4, fonds: 1 });

  const EMPTY_FORM = {
    name: "", city: "", advisor: "Benoit", phone: "", address: "", genre: "Homme",
    pillar: "2e pilier", capital: "", deadline: "", status: "Nouveau",
    fund: FUNDS[0].id, profile: "Modéré", productType: "Bancaire", select: "Select 50",
  };
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(EMPTY_FORM);
  const [formError, setFormError] = useState("");
  const [addDossierFor, setAddDossierFor] = useState(null); // personId, or null = new person

  function updateForm(key, value) {
    setForm((prev) => ({ ...prev, [key]: value }));
  }

  function openNewClientForm() {
    setAddDossierFor(null);
    setForm(EMPTY_FORM);
    setFormError("");
    setShowForm(true);
  }

  function openAddDossierForm(personId) {
    setAddDossierFor(personId);
    setForm(EMPTY_FORM);
    setFormError("");
    setShowForm(true);
  }

  function buildDossierFromForm(personId) {
    const todayStr = TODAY.toISOString().slice(0, 10);
    const nextDossierId = Math.max(0, ...dossiers.map((d) => d.id)) + 1;
    const dossier = {
      id: nextDossierId,
      personId,
      pillar: form.pillar,
      capital: Math.round(parseFloat(form.capital)),
      deadline: form.deadline || todayStr,
      status: form.status,
      lastContact: todayStr,
    };
    if (form.pillar === "2e pilier") {
      dossier.fund = form.fund;
      dossier.profile = form.profile;
    } else {
      dossier.productType = form.productType;
      if (form.productType === "Assurance") dossier.select = form.select;
    }
    return dossier;
  }

  function submitForm() {
    if (!form.capital || isNaN(parseFloat(form.capital))) { setFormError("Le capital doit être un nombre."); return; }

    if (addDossierFor) {
      const dossier = buildDossierFromForm(addDossierFor);
      setDossiers((prev) => [...prev, dossier]);
      setShowForm(false);
      const person = people.find((p) => p.id === addDossierFor);
      showToast("Nouveau dossier " + form.pillar + " ajouté pour " + (person ? person.name : "le client") + ".");
    } else {
      if (!form.name.trim()) { setFormError("Le nom est obligatoire."); return; }
      const nextPersonId = Math.max(0, ...people.map((p) => p.id)) + 1;
      const newPerson = {
        id: nextPersonId,
        name: form.name.trim(),
        city: form.city.trim(),
        advisor: form.advisor,
        phone: form.phone.trim(),
        address: form.address.trim(),
        genre: form.genre,
      };
      const dossier = buildDossierFromForm(nextPersonId);
      setPeople((prev) => [...prev, newPerson]);
      setDossiers((prev) => [...prev, dossier]);
      setShowForm(false);
      showToast(newPerson.name + " a été ajouté(e) à la liste des clients.");
    }
  }

  function updateRate(key, value) {
    const n = parseFloat(value);
    setRates((prev) => ({ ...prev, [key]: isNaN(n) ? 0 : n }));
  }

  function personOf(dossier) {
    return people.find((p) => p.id === dossier.personId) || {};
  }

  const dossiersJoined = dossiers.map((d) => ({ ...d, person: personOf(d) }));

  const upcoming = dossiersJoined.filter((d) => daysUntil(d.deadline) <= 30 && daysUntil(d.deadline) >= 0)
    .sort((a, b) => daysUntil(a.deadline) - daysUntil(b.deadline));

  const PILLARS = ["Tous", "2e pilier", "3e pilier A", "3e pilier B"];
  const STATUSES = ["Tous", "Actif", "Suivi requis", "À recontacter", "Nouveau"];

  const peopleWithDossiers = people.map((p) => {
    const own = dossiers.filter((d) => d.personId === p.id);
    const totalCapital = own.reduce((s, d) => s + d.capital, 0);
    const pillarsHeld = [...new Set(own.map((d) => d.pillar))];
    const nearest = own.length
      ? own.reduce((min, d) => (daysUntil(d.deadline) < daysUntil(min.deadline) ? d : min))
      : null;
    return { ...p, dossiers: own, totalCapital, pillarsHeld, nearestDeadline: nearest ? nearest.deadline : null };
  });

  let filteredPeople = peopleWithDossiers.filter((p) =>
    (p.name + " " + p.city).toLowerCase().includes(search.toLowerCase())
  );
  if (pillarFilter !== "Tous") filteredPeople = filteredPeople.filter((p) => p.pillarsHeld.includes(pillarFilter));
  if (statusFilter !== "Tous") filteredPeople = filteredPeople.filter((p) => p.dossiers.some((d) => d.status === statusFilter));
  if (advisorFilter !== "Tous") filteredPeople = filteredPeople.filter((p) => p.advisor === advisorFilter);

  if (sortKey) {
    filteredPeople = [...filteredPeople].sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === "nearestDeadline") { av = av ? new Date(av) : new Date(8640000000000000); bv = bv ? new Date(bv) : new Date(8640000000000000); }
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });
  }

  function toggleSort(key) {
    if (sortKey === key) {
      setSortDir(sortDir === "asc" ? "desc" : "asc");
    } else {
      setSortKey(key);
      setSortDir("asc");
    }
  }

  const openDeals = deals.filter((d) => d.stage !== "Signé").length;

  const PILLAR_GROUPS = ["2e pilier", "3e pilier A", "3e pilier B"];
  const pillarBreakdown = PILLAR_GROUPS.map((p) => {
    const count = dossiers.filter((d) => d.pillar === p).length;
    const share = dossiers.length > 0 ? count / dossiers.length : 0;
    return {
      pillar: p,
      projectedCount: Math.round(TOTAL_PORTFOLIO * share),
      projectedCapital: Math.round(TOTAL_CAPITAL * share),
      share,
    };
  });

  const total2ePilierSample = dossiers.filter((d) => d.pillar === "2e pilier").reduce((s, d) => s + d.capital, 0);
  const fundBreakdown = FUNDS.map((f) => {
    const linked = dossiers.filter((d) => d.fund === f.id);
    const sampleCapital = linked.reduce((s, d) => s + d.capital, 0);
    const share = total2ePilierSample > 0 ? sampleCapital / total2ePilierSample : 0;
    const projectedCapital = Math.round(pillarBreakdown[0].projectedCapital * share);
    return {
      ...f,
      linkedCount: linked.length,
      projectedCapital,
      commissionAmount: Math.round(projectedCapital * (rates.pilier2 / 100)),
      nextCommission: nextQuarterly(f.anchor),
    };
  }).sort((a, b) => a.nextCommission - b.nextCommission);
  const fundsDueSoon = fundBreakdown.filter((f) => daysUntilDate(f.nextCommission) <= 30).length;

  const PRODUCT_TYPES = ["Bancaire", "Assurance", "Fonds de placement"];
  const total3ePilierSample = dossiers.filter((d) => d.pillar.startsWith("3e")).reduce((s, d) => s + d.capital, 0);
  const productBreakdown = PRODUCT_TYPES.map((type) => {
    const linked = dossiers.filter((d) => d.productType === type);
    const sampleCapital = linked.reduce((s, d) => s + d.capital, 0);
    const share = total3ePilierSample > 0 ? sampleCapital / total3ePilierSample : 0;
    const projected3eCapital = pillarBreakdown[1].projectedCapital + pillarBreakdown[2].projectedCapital;
    const projectedCapital = Math.round(projected3eCapital * share);
    let rate = 0;
    if (type === "Assurance") rate = rates.assurance;
    if (type === "Fonds de placement") rate = rates.fonds;
    return {
      type,
      linkedCount: linked.length,
      projectedCapital,
      commissionAmount: Math.round(projectedCapital * (rate / 100)),
      recurring: type === "Fonds de placement",
    };
  });

  function moveStage(dealId, direction) {
    setDeals((prev) =>
      prev.map((d) => {
        if (d.id !== dealId) return d;
        const idx = PIPELINE_STAGES.indexOf(d.stage);
        const next = idx + direction;
        if (next < 0 || next >= PIPELINE_STAGES.length) return d;
        return { ...d, stage: PIPELINE_STAGES[next] };
      })
    );
  }

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(""), 2600);
  }

  return (
    <div className="app">

        <div className="brand">
          Rivage Prévoyance
          <span>Cabinet de conseil</span>
        </div>
        <div className={"nav-item" + (view === "dashboard" ? " active" : "")} onClick={() => setView("dashboard")}>
          <LayoutDashboard size={16} /> Tableau de bord
        </div>
        <div className={"nav-item" + (view === "clients" ? " active" : "")} onClick={() => { setView("clients"); setPillarFilter("Tous"); }}>
          <Users size={16} /> Clients
        </div>
        {view === "clients" && (
          <div className="sub-nav">
            {PILLARS.map((p) => (
              <div
                key={p}
                className={"sub-nav-item" + (pillarFilter === p ? " active" : "")}
                onClick={() => setPillarFilter(p)}
              >
                {p === "Tous" ? "Tous les clients" : p}
              </div>
            ))}
          </div>
        )}
        <div className={"nav-item" + (view === "pipeline" ? " active" : "")} onClick={() => setView("pipeline")}>
          <GitBranch size={16} /> Pipeline
        </div>
        <div className="nav-spacer" />
        <div className="sidebar-foot">
          {TOTAL_PORTFOLIO.toLocaleString("fr-CH")} clients au portefeuille. Échantillon de démonstration ci-contre.
        </div>
      </div>

      <div className="main" style={{ position: "relative" }}>
        <div className="topbar">
          <h1>
            {view === "dashboard" && "Tableau de bord"}
            {view === "clients" && "Clients"}
            {view === "pipeline" && "Pipeline commercial"}
          </h1>
          <div style={{ display: "flex", gap: "10px", alignItems: "center" }}>
            {view === "clients" && (
              <div className="search-box">
                <Search size={14} color="var(--ink-soft)" />
                <input placeholder="Rechercher un nom, une ville…" value={search} onChange={(e) => setSearch(e.target.value)} />
              </div>
            )}
            <button className="btn-primary" onClick={openNewClientForm}>
              + Nouveau client
            </button>
          </div>
        </div>

        <div className="content">
          {view === "dashboard" && (
            <>
              <div className="kpi-grid">
                <div className="kpi"><div className="label">Clients actifs</div><div className="value">{TOTAL_PORTFOLIO.toLocaleString("fr-CH")}</div></div>
                <div className="kpi"><div className="label">Capital sous suivi</div><div className="value">{formatCHF(TOTAL_CAPITAL)}</div></div>
                <div className="kpi"><div className="label">Échéances à 30 jours</div><div className="value accent">{upcoming.length}</div></div>
                <div className="kpi"><div className="label">Dossiers en pipeline</div><div className="value">{openDeals}</div></div>
                <div className="kpi"><div className="label">Commissions fonds (30j)</div><div className="value accent">{fundsDueSoon}</div></div>
              </div>

              <div className="panel">
                <h2>Répartition par pilier</h2>
                {pillarBreakdown.map((row) => (
                  <div className="pillar-row" key={row.pillar}>
                    <div className="pillar-row-head">
                      <span>{row.pillar}</span>
                      <span className="num-right">
                        {row.projectedCount.toLocaleString("fr-CH")} clients · {formatCHF(row.projectedCapital)}
                      </span>
                    </div>
                    <div className="pillar-bar-track">
                      <div className="pillar-bar-fill" style={{ width: (row.share * 100) + "%" }}></div>
                    </div>
                  </div>
                ))}
              </div>

              <div className="panel-row" style={{ marginTop: "22px" }}>
                <div className="panel">
                  <h2>Prochaines échéances</h2>
                  {upcoming.length === 0 && <div className="list-row muted">Aucune échéance dans les 30 prochains jours.</div>}
                  {upcoming.map((d) => (
                    <div className="list-row" key={d.id}>
                      <div>{d.person.name}<div className="muted">{d.pillar} — {d.person.city}</div></div>
                      <div className="num-right">{formatDate(d.deadline)}</div>
                    </div>
                  ))}
                </div>
                <div className="panel">
                  <h2>Dossiers récemment suivis</h2>
                  {dossiersJoined.slice().sort((a, b) => new Date(b.lastContact) - new Date(a.lastContact)).slice(0, 6).map((d) => (
                    <div className="list-row" key={d.id}>
                      <div>{d.person.name}<div className="muted">{d.pillar} — {d.person.city}</div></div>
                      <div className="num-right">{formatDate(d.lastContact)}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="panel" style={{ marginTop: "22px" }}>
                <div className="panel-head-row">
                  <h2 style={{ border: "none", padding: 0 }}>Commissions trimestrielles par fonds</h2>
                  <div style={{ display: "flex", gap: "16px", flexWrap: "wrap" }}>
                    <div className="rate-input">
                      <label>Signature</label>
                      <input type="number" step="0.1" min="0" value={rates.pilier2Signature} onChange={(e) => updateRate("pilier2Signature", e.target.value)} />
                      <span>%</span>
                    </div>
                    <div className="rate-input">
                      <label>Récurrent</label>
                      <input type="number" step="0.1" min="0" value={rates.pilier2} onChange={(e) => updateRate("pilier2", e.target.value)} />
                      <span>%</span>
                    </div>
                  </div>
                </div>
                <div className="table-note" style={{ padding: "12px 18px 0 18px", margin: 0 }}>
                  "Signature" (voir fiche client) : commission unique de {rates.pilier2Signature}% sur le capital individuel, versée une fois, au moment où le client place ses avoirs dans le fonds. "Récurrent" ci-dessous : commission versée par le fonds tous les 3 mois, calculée sur le capital total de tous nos clients placés dans ce fonds.
                </div>
                {fundBreakdown.map((f) => {
                  const d = daysUntilDate(f.nextCommission);
                  return (
                    <div className="list-row" key={f.id}>
                      <div>
                        {f.name}
                        <div className="muted">{formatCHF(f.projectedCapital)} · {f.linkedCount} client{f.linkedCount > 1 ? "s" : ""} (échantillon)</div>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        <div className="num-right" style={{ color: d <= 30 ? "var(--amber)" : "var(--ink-soft)" }}>
                          {f.nextCommission.toLocaleDateString("fr-CH", { day: "2-digit", month: "2-digit", year: "numeric" })}
                        </div>
                        <div className="num-right" style={{ color: "var(--accent)", fontSize: "12px", marginTop: "2px" }}>
                          ≈ {formatCHF(f.commissionAmount)} / trim.
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="panel" style={{ marginTop: "22px" }}>
                <h2 style={{ border: "none", padding: "14px 18px 4px 18px" }}>Commissions 3e pilier (estimation)</h2>
                <div className="table-note" style={{ padding: "0 18px 12px 18px", margin: 0 }}>
                  Bancaire : pas de commission. Assurance : commission unique à la souscription. Fonds de placement : commission de gestion annuelle (TER).
                </div>
                {productBreakdown.map((p) => (
                  <div className="list-row" key={p.type}>
                    <div>
                      {p.type}
                      <div className="muted">{formatCHF(p.projectedCapital)} · {p.linkedCount} client{p.linkedCount > 1 ? "s" : ""} (échantillon)</div>
                    </div>
                    <div style={{ textAlign: "right", display: "flex", alignItems: "center", gap: "10px" }}>
                      {p.type !== "Bancaire" && (
                        <div className="rate-input">
                          <input
                            type="number" step="0.1" min="0"
                            value={p.type === "Assurance" ? rates.assurance : rates.fonds}
                            onChange={(e) => updateRate(p.type === "Assurance" ? "assurance" : "fonds", e.target.value)}
                          />
                          <span>%</span>
                        </div>
                      )}
                      <div className="num-right" style={{ color: p.type === "Bancaire" ? "var(--ink-soft)" : "var(--accent)", minWidth: "110px" }}>
                        {p.type === "Bancaire" ? "—" : "≈ " + formatCHF(p.commissionAmount) + (p.recurring ? " / an" : "")}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </>
          )}

          {view === "clients" && (
            <>
              <div className="advisor-legend">
                <span><span className="advisor-dot" style={{ background: ADVISOR_COLOR["Benoit"] }}></span>Benoit</span>
                <span><span className="advisor-dot" style={{ background: ADVISOR_COLOR["Thaiana"] }}></span>Thaiana</span>
              </div>
              <div className="filter-bar">
                <select className="filter-select" value={pillarFilter} onChange={(e) => setPillarFilter(e.target.value)}>
                  {PILLARS.map((p) => <option key={p} value={p}>{p === "Tous" ? "Tous les piliers" : p}</option>)}
                </select>
                <select className="filter-select" value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
                  {STATUSES.map((s) => <option key={s} value={s}>{s === "Tous" ? "Tous les statuts" : s}</option>)}
                </select>
                <select className="filter-select" value={advisorFilter} onChange={(e) => setAdvisorFilter(e.target.value)}>
                  {ADVISORS.map((a) => <option key={a} value={a}>{a === "Tous" ? "Tous les conseillers" : a}</option>)}
                </select>
                {(pillarFilter !== "Tous" || statusFilter !== "Tous" || advisorFilter !== "Tous") && (
                  <button className="filter-clear" onClick={() => { setPillarFilter("Tous"); setStatusFilter("Tous"); setAdvisorFilter("Tous"); }}>
                    Réinitialiser
                  </button>
                )}
              </div>
              <div className="table-note">
                {filteredPeople.length} client{filteredPeople.length > 1 ? "s" : ""} affiché{filteredPeople.length > 1 ? "s" : ""} sur un échantillon de démonstration ({TOTAL_PORTFOLIO.toLocaleString("fr-CH")} au total dans le portefeuille réel). Un client peut avoir plusieurs dossiers (2e et 3e pilier).
              </div>
              <table>
                <thead>
                  <tr>
                    <th className="sortable" onClick={() => toggleSort("name")}>Nom{sortKey === "name" ? (sortDir === "asc" ? " ↑" : " ↓") : ""}</th>
                    <th>Ville</th>
                    <th>Dossiers</th>
                    <th className="sortable" onClick={() => toggleSort("totalCapital")}>Capital total{sortKey === "totalCapital" ? (sortDir === "asc" ? " ↑" : " ↓") : ""}</th>
                    <th>Conseiller</th>
                    <th className="sortable" onClick={() => toggleSort("nearestDeadline")}>Prochaine échéance{sortKey === "nearestDeadline" ? (sortDir === "asc" ? " ↑" : " ↓") : ""}</th>
                  </tr>
                </thead>
                <tbody>
                  {filteredPeople.map((p) => (
                    <tr key={p.id} onClick={() => setSelected(p)} style={{ background: ADVISOR_COLOR[p.advisor] + "14" }}>
                      <td data-label="Nom">
                        <span className="advisor-dot" style={{ background: ADVISOR_COLOR[p.advisor] }}></span>
                        {p.name}
                      </td>
                      <td data-label="Ville">{p.city}</td>
                      <td data-label="Dossiers">
                        {p.dossiers.map((d) => (
                          <span className="pillar-tag" key={d.id} style={{ marginRight: "4px", marginBottom: "3px", display: "inline-block" }}>
                            {d.pillar}
                            <span className={"badge " + STATUS_CLASS[d.status]} style={{ marginLeft: "5px", padding: "1px 5px" }}>{d.status}</span>
                          </span>
                        ))}
                      </td>
                      <td data-label="Capital total" className="cell-num">{formatCHF(p.totalCapital)}</td>
                      <td data-label="Conseiller">{p.advisor}</td>
                      <td data-label="Échéance" className="cell-num">{p.nearestDeadline ? formatDate(p.nearestDeadline) : "—"}</td>
                    </tr>
                  ))}
                  {filteredPeople.length === 0 && (
                    <tr><td colSpan="6" style={{ textAlign: "center", color: "var(--ink-soft)", padding: "20px" }}>Aucun client ne correspond à ces filtres.</td></tr>
                  )}
                </tbody>
              </table>
            </>
          )}

          {view === "pipeline" && (
            <div className="pipeline">
              {PIPELINE_STAGES.map((stage) => {
                const stageDeals = deals.filter((d) => d.stage === stage);
                return (
                  <div className="stage-col" key={stage}>
                    <div className="stage-head"><span>{stage}</span><span>{stageDeals.length}</span></div>
                    {stageDeals.map((d) => {
                      const idx = PIPELINE_STAGES.indexOf(d.stage);
                      return (
                        <div className="stage-card" key={d.id} style={{ borderLeft: "3px solid " + ADVISOR_COLOR[d.advisor], background: ADVISOR_COLOR[d.advisor] + "0D" }}>
                          <div className="name">{d.name}</div>
                          <div className="muted">{d.pillar} — {d.city} · {d.advisor}</div>
                          <div className="cap">{formatCHF(d.estCapital)}</div>
                          <div className="stage-nav">
                            <button disabled={idx === 0} onClick={() => moveStage(d.id, -1)}><ChevronLeft size={13} /></button>
                            <button disabled={idx === PIPELINE_STAGES.length - 1} onClick={() => moveStage(d.id, 1)}><ChevronRight size={13} /></button>
                          </div>
                        </div>
                      );
                    })}
                    {stageDeals.length === 0 && <div className="muted" style={{ padding: "4px" }}>—</div>}
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {selected && (
          <div className="detail-overlay" onClick={() => setSelected(null)}>
            <div className="detail-panel" onClick={(e) => e.stopPropagation()}>
              <div className="detail-head">
                <div>
                  <h2>{selected.name}</h2>
                  <div className="muted">{selected.city}</div>
                </div>
                <button className="close-btn" onClick={() => setSelected(null)}><XIcon size={18} /></button>
              </div>
              <div className="detail-section">
                <h3>Coordonnées</h3>
                <div className="kv"><span>Genre</span><span>{selected.genre}</span></div>
                <div className="kv">
                  <span>Conseiller</span>
                  <span><span className="advisor-dot" style={{ background: ADVISOR_COLOR[selected.advisor] }}></span>{selected.advisor}</span>
                </div>
                <div className="kv"><span>Téléphone</span><span className="num-right">{selected.phone}</span></div>
                <div className="kv" style={{ alignItems: "flex-start" }}><span>Adresse</span><span className="num-right" style={{ textAlign: "right", maxWidth: "220px" }}>{selected.address}</span></div>
              </div>

              {selected.dossiers.map((dossier) => (
                <div key={dossier.id} className="dossier-block">
                  <div className="dossier-block-head">
                    <span className="pillar-tag">{dossier.pillar}</span>
                    <span className={"badge " + STATUS_CLASS[dossier.status]}>{dossier.status}</span>
                  </div>
                  <div className="detail-section">
                    <div className="kv"><span>Capital</span><span className="num-right">{formatCHF(dossier.capital)}</span></div>
                    <div className="kv"><span>Prochaine échéance</span><span className="num-right">{formatDate(dossier.deadline)}</span></div>
                    <div className="kv"><span>Dernier contact</span><span className="num-right">{formatDate(dossier.lastContact)}</span></div>
                    {dossier.pillar === "2e pilier" && (
                      <div className="kv"><span>Profil de risque</span><span>{dossier.profile || "—"}</span></div>
                    )}
                  </div>
                  {dossier.pillar !== "2e pilier" && (() => {
                    const commission = computeCommission(dossier, rates);
                    if (!commission) return null;
                    return (
                      <div className="detail-section">
                        <h3>Commission</h3>
                        <div className="kv"><span>Type de produit</span><span>{commission.type}</span></div>
                        {dossier.select && (
                          <div className="kv"><span>Garantie</span><span>{dossier.select}</span></div>
                        )}
                        <div className="kv">
                          <span>Montant estimé</span>
                          <span className="num-right" style={{ color: commission.amount > 0 ? "var(--accent)" : "var(--ink-soft)" }}>
                            {commission.amount > 0 ? formatCHF(commission.amount) : "—"}
                          </span>
                        </div>
                        <div className="muted" style={{ fontSize: "12px", marginTop: "6px" }}>{commission.note}</div>
                      </div>
                    );
                  })()}
                  {dossier.pillar === "2e pilier" && dossier.fund && (() => {
                    const fundInfo = FUNDS.find((f) => f.id === dossier.fund);
                    const signatureAmount = Math.round(dossier.capital * (rates.pilier2Signature / 100));
                    const recurringAmount = Math.round(dossier.capital * (rates.pilier2 / 100));
                    return (
                      <div className="detail-section">
                        <h3>Commission</h3>
                        <div className="kv"><span>Fonds</span><span>{fundInfo ? fundInfo.name : "—"}</span></div>
                        <div className="kv">
                          <span>Commission signature ({rates.pilier2Signature}%, unique)</span>
                          <span className="num-right" style={{ color: "var(--accent)" }}>{formatCHF(signatureAmount)}</span>
                        </div>
                        <div className="kv">
                          <span>Commission récurrente ({rates.pilier2}% / 3 mois)</span>
                          <span className="num-right" style={{ color: "var(--accent)" }}>{formatCHF(recurringAmount)}</span>
                        </div>
                      </div>
                    );
                  })()}
                  <div className="detail-section">
                    <h3>Historique</h3>
                    {(HISTORY[dossier.id] || DEFAULT_HISTORY).map((h, i) => <div className="hist-item" key={i}>{h}</div>)}
                  </div>
                </div>
              ))}

              <div className="detail-section">
                <button className="btn-secondary" style={{ width: "100%" }} onClick={() => openAddDossierForm(selected.id)}>
                  + Ajouter un dossier (2e ou 3e pilier)
                </button>
              </div>
              <div className="detail-section">
                <h3>Notes</h3>
                <div className="muted" style={{ fontSize: "12.5px" }}>Zone de notes libres — à connecter à la base de données du cabinet.</div>
              </div>
            </div>
          </div>
        )}

        {showForm && (
          <div className="form-overlay" onClick={() => setShowForm(false)}>
            <div className="form-panel" onClick={(e) => e.stopPropagation()}>
              <div className="form-head">
                <h2>{addDossierFor ? "Nouveau dossier" : "Nouveau client"}</h2>
                <button className="close-btn" onClick={() => setShowForm(false)}><XIcon size={18} /></button>
              </div>
              <div className="form-body">
                {addDossierFor && (() => {
                  const person = people.find((p) => p.id === addDossierFor);
                  return <div className="table-note" style={{ margin: 0 }}>Ajout d'un dossier pour <strong>{person ? person.name : ""}</strong>.</div>;
                })()}
                {!addDossierFor && (
                  <>
                    <div className="form-row">
                      <label>Nom complet *</label>
                      <input type="text" value={form.name} onChange={(e) => updateForm("name", e.target.value)} placeholder="Prénom Nom" />
                    </div>
                    <div className="form-row-split">
                      <div className="form-row">
                        <label>Ville</label>
                        <input type="text" value={form.city} onChange={(e) => updateForm("city", e.target.value)} placeholder="Genève" />
                      </div>
                      <div className="form-row">
                        <label>Genre</label>
                        <select value={form.genre} onChange={(e) => updateForm("genre", e.target.value)}>
                          <option value="Homme">Homme</option>
                          <option value="Femme">Femme</option>
                        </select>
                      </div>
                    </div>
                    <div className="form-row-split">
                      <div className="form-row">
                        <label>Téléphone</label>
                        <input type="text" value={form.phone} onChange={(e) => updateForm("phone", e.target.value)} placeholder="+41 79 000 00 00" />
                      </div>
                      <div className="form-row">
                        <label>Conseiller</label>
                        <select value={form.advisor} onChange={(e) => updateForm("advisor", e.target.value)}>
                          <option value="Benoit">Benoit</option>
                          <option value="Thaiana">Thaiana</option>
                        </select>
                      </div>
                    </div>
                    <div className="form-row">
                      <label>Adresse</label>
                      <input type="text" value={form.address} onChange={(e) => updateForm("address", e.target.value)} placeholder="Rue Exemple 1, 1200 Genève" />
                    </div>
                  </>
                )}

                <div className="form-row-split">
                  <div className="form-row">
                    <label>Pilier</label>
                    <select value={form.pillar} onChange={(e) => updateForm("pillar", e.target.value)}>
                      <option value="2e pilier">2e pilier</option>
                      <option value="3e pilier A">3e pilier A</option>
                      <option value="3e pilier B">3e pilier B</option>
                    </select>
                  </div>
                  <div className="form-row">
                    <label>Capital (CHF) *</label>
                    <input type="number" value={form.capital} onChange={(e) => updateForm("capital", e.target.value)} placeholder="50000" />
                  </div>
                </div>
                <div className="form-row-split">
                  <div className="form-row">
                    <label>Statut</label>
                    <select value={form.status} onChange={(e) => updateForm("status", e.target.value)}>
                      {STATUSES.filter((s) => s !== "Tous").map((s) => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>
                  <div className="form-row">
                    <label>Prochaine échéance</label>
                    <input type="date" value={form.deadline} onChange={(e) => updateForm("deadline", e.target.value)} />
                  </div>
                </div>

                {form.pillar === "2e pilier" ? (
                  <div className="form-row-split">
                    <div className="form-row">
                      <label>Fonds</label>
                      <select value={form.fund} onChange={(e) => updateForm("fund", e.target.value)}>
                        {FUNDS.map((f) => <option key={f.id} value={f.id}>{f.name}</option>)}
                      </select>
                    </div>
                    <div className="form-row">
                      <label>Profil de risque</label>
                      <select value={form.profile} onChange={(e) => updateForm("profile", e.target.value)}>
                        {RISK_PROFILES.map((p) => <option key={p} value={p}>{p}</option>)}
                      </select>
                    </div>
                  </div>
                ) : (
                  <div className="form-row-split">
                    <div className="form-row">
                      <label>Type de produit</label>
                      <select value={form.productType} onChange={(e) => updateForm("productType", e.target.value)}>
                        <option value="Bancaire">Bancaire</option>
                        <option value="Assurance">Assurance</option>
                        <option value="Fonds de placement">Fonds de placement</option>
                      </select>
                    </div>
                    {form.productType === "Assurance" && (
                      <div className="form-row">
                        <label>Garantie (Select)</label>
                        <select value={form.select} onChange={(e) => updateForm("select", e.target.value)}>
                          {SELECT_OPTIONS.map((s) => <option key={s} value={s}>{s}</option>)}
                        </select>
                      </div>
                    )}
                  </div>
                )}

                {formError && <div className="form-error">{formError}</div>}
              </div>
              <div className="form-foot">
                <button className="btn-secondary" onClick={() => setShowForm(false)}>Annuler</button>
                <button className="btn-primary" onClick={submitForm}>Enregistrer</button>
              </div>
            </div>
          </div>
        )}

        {toast && <div className="toast">{toast}</div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(CRMPrototype));
</script>

<script>
  // Manually transform with the classic runtime so the output calls
  // React.createElement directly instead of emitting "import" statements
  // (which a plain <script> tag cannot execute and causes a blank page).
  var source = document.getElementById("app-source").textContent;
  var compiled = Babel.transform(source, {
    presets: [["react", { runtime: "classic" }]]
  }).code;
  try {
    new Function("React", "ReactDOM", "document", compiled)(React, ReactDOM, document);
  } catch (e) {
    document.getElementById("root").innerHTML =
      '<pre style="padding:24px;color:#A23B2E;font-family:monospace;white-space:pre-wrap;">' +
      'Erreur de chargement de la démo :\n' + e.message + '</pre>';
  }
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  --bg: #F7F6F2; --surface: #FFFFFF; --sidebar-bg: #16213B; --sidebar-text: #A9B4C6;
  --ink: #1B2333; --ink-soft: #5B6478; --accent: #2F6F5E; --accent-soft: #E3ECE8;
  --amber: #A6761E; --amber-soft: #F3E9D6; --red: #A23B2E; --red-soft: #F5E3DF; --border: #E2DFD7;
  font-family: 'IBM Plex Sans', sans-serif; color: var(--ink); background: var(--bg);
  display: flex; width: 100%; min-height: 100vh;
}
.sidebar { width: 216px; flex-shrink: 0; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; padding: 22px 16px; }
