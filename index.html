<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
* { box-sizing: border-box; }
.app {
  --bg: #F7F6F2; --surface: #FFFFFF; --sidebar-bg: #16213B; --sidebar-text: #A9B4C6;
  --ink: #1B2333; --ink-soft: #5B6478; --accent: #2F6F5E; --accent-soft: #E3ECE8;
  --amber: #A6761E; --amber-soft: #F3E9D6; --red: #A23B2E; --red-soft: #F5E3DF; --border: #E2DFD7;
  font-family: 'IBM Plex Sans', sans-serif; color: var(--ink); background: var(--bg);
  display: flex; width: 100%; min-height: 100vh;
}
.sidebar { width: 216px; flex-shrink: 0; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; padding: 22px 16px; }
.brand { font-family: 'Source Serif 4', serif; font-size: 18px; color: #fff; font-weight: 600; padding: 0 8px 22px 8px; border-bottom: 1px solid rgba(255,255,255,0.12); margin-bottom: 18px; }
.brand span { display: block; font-family: 'IBM Plex Sans', sans-serif; font-size: 11.5px; color: var(--sidebar-text); font-weight: 400; margin-top: 3px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 3px; font-size: 14px; cursor: pointer; color: var(--sidebar-text); margin-bottom: 2px; border-left: 2px solid transparent; }
.nav-item:hover { color: #fff; }
.nav-item.active { color: #fff; background: rgba(255,255,255,0.07); border-left: 2px solid var(--accent); }
.sub-nav { margin: 2px 0 6px 10px; border-left: 1px solid rgba(255,255,255,0.14); }
.sub-nav-item { padding: 7px 10px 7px 16px; font-size: 12.5px; color: var(--sidebar-text); cursor: pointer; }
.sub-nav-item:hover { color: #fff; }
.sub-nav-item.active { color: #fff; font-weight: 500; }
.nav-spacer { flex: 1; }
.sidebar-foot { font-size: 11.5px; color: var(--sidebar-text); padding: 10px 8px 0 8px; border-top: 1px solid rgba(255,255,255,0.12); line-height: 1.5; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; border-bottom: 1px solid var(--border); background: var(--surface); }
.topbar h1 { font-family: 'Source Serif 4', serif; font-size: 20px; font-weight: 600; margin: 0; }
